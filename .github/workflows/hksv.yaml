name: HKSV validation

# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - homeassistant/components/homekit/**
      - homeassistant/components/stream/**
      - tests/components/homekit/**
      - tests/components/stream/**
      - Dockerfile.hksv
      - Dockerfile.hksv.dockerignore
      - .github/workflows/hksv.yaml
  pull_request:
    paths:
      - homeassistant/components/homekit/**
      - homeassistant/components/stream/**
      - tests/components/homekit/**
      - tests/components/stream/**
      - Dockerfile.hksv
      - Dockerfile.hksv.dockerignore
      - .github/workflows/hksv.yaml
  workflow_dispatch:

concurrency:
  group: hksv-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test native HKSV
    if: github.repository == 'samhologram/home-assistant-hksv'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned HAP fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samhologram/HAP-python-hksv
          ref: e6bd1a45c10f2b6710d3e0fa2e8b5e27b5ddd6c6
          path: .hksv-deps/HAP-python
          persist-credentials: false
      - name: Test HomeKit and stream
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            homeassistant/home-assistant@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f \
            -euc '
              uv build --wheel --out-dir /tmp/hksv-wheel .hksv-deps/HAP-python
              uv pip install --system --no-deps /tmp/hksv-wheel/hap_python-5.0.0.post1-py3-none-any.whl
              python3 -c "from pathlib import Path; import re; lines = Path(\"requirements_test.txt\").read_text().splitlines(); Path(\"requirements-hksv-test-filtered.txt\").write_text(\"\\n\".join(line for line in lines if not line.startswith(\"-r \") and not re.match(r\"(?i)^(ast-serialize|librt|mypy|prek|pipdeptree|types-[^= ]+)==\", line)) + \"\\n\")"
              uv pip install --system --index-strategy unsafe-best-match -r requirements-hksv-test-filtered.txt ruff==0.16.9
              python3 -c "from importlib.metadata import version; assert version(\"HAP-python\") == \"5.0.0.post1\""
              python3 -m script.translations develop --all
              ruff check homeassistant/components/homekit homeassistant/components/stream tests/components/homekit tests/components/stream
              ruff format --check homeassistant/components/homekit homeassistant/components/stream tests/components/homekit tests/components/stream
              pylint --ignore-missing-annotations=y homeassistant/components/homekit/hksv_*.py homeassistant/components/homekit/type_cameras.py homeassistant/components/stream/__init__.py homeassistant/components/stream/core.py homeassistant/components/stream/worker.py
              python3 -m pytest -q --tb=short --show-capture=no tests/components/homekit tests/components/stream
            '
